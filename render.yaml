services:
  - type: web
    name: bpss-tiktoks
    runtime: python
    plan: free
    buildCommand: apt-get update && apt-get install -y ffmpeg && curl -fsSL https://deno.land/install.sh | sh -s v2.1.0 && ln -sf /root/.deno/bin/deno /usr/local/bin/deno && pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    healthCheckPath: /
