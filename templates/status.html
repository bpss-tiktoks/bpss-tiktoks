<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Descargando...</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
<h1>Bpss TikToks</h1>
<p class="warn">Videos privados no se pueden descargar. Solo publicos.</p>
<div id="msg">
<div class="spinner"></div>
<p class="loading-text">Descargando...</p>
</div>
<script>
var id='{{ task_id }}';
var tries=0;
function check(){
tries++;
if(tries>90){
document.getElementById('msg').innerHTML='<p class="error-text">Timeout. Intentalo de nuevo.</p><a href="/" class="link-back">Volver</a>';
return;
}
fetch('/api/status/'+id).then(function(r){return r.json()}).then(function(d){
if(d.status==='done'){
var dlUrl=location.origin+'/download/'+d.file;
var shareText='Descarga aqui: '+dlUrl;
var dlCount=parseInt(localStorage.getItem('bpss_dl_count')||'0')+1;
localStorage.setItem('bpss_dl_count',dlCount);
document.getElementById('msg').innerHTML=
'<p class="success-text">Listo</p>'+
'<a href="'+dlUrl+'" class="btn-download">Descargar</a>'+
'<div class="actions">'+
'<button class="btn-action" onclick="navigator.clipboard.writeText(\''+dlUrl+'\');this.textContent=\'Copiado\'">Copiar</button>'+
'<a class="btn-action" href="https://wa.me/?text='+encodeURIComponent(shareText)+'" target="_blank">WhatsApp</a>'+
'<a class="btn-action" href="https://t.me/share/url?url='+encodeURIComponent(dlUrl)+'" target="_blank">Telegram</a>'+
'</div>'+
'<form method="POST" action="/" class="next-form">'+
'<input type="text" name="url" placeholder="Otra URL...">'+
'<button type="submit" name="type" value="video">Video</button>'+
'<button type="submit" name="type" value="audio">Audio</button>'+
'</form>';
}else if(d.status==='error'){
document.getElementById('msg').innerHTML='<p class="error-text">'+(d.error||'Error')+'</p><a href="/" class="link-back">Volver</a>';
}else{
setTimeout(check,2000);
}
}).catch(function(){setTimeout(check,3000)});
}
setTimeout(check,2000);
</script>
</div>
</body>
</html>
