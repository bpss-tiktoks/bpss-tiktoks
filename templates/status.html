<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Descargando...</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
<h1>Bpss TikToks</h1>
<div id="msg">
<div style="width:36px;height:36px;border:4px solid #fe2c55;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto"></div>
<p style="margin-top:.8rem;color:#666;font-size:.8rem">Descargando...</p>
</div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
<script>
var id='{{ task_id }}';
var tries=0;
function check(){
tries++;
if(tries>90){
document.getElementById('msg').innerHTML='<p style="color:#c0392b;font-size:.8rem">Timeout. Intentalo de nuevo.</p><a href="/" style="display:inline-block;margin-top:.6rem;color:#fe2c55;font-size:.8rem">Volver</a>';
return;
}
fetch('/api/status/'+id).then(function(r){return r.json()}).then(function(d){
if(d.status==='done'){
var dlUrl=location.origin+'/download/'+d.file;
var shareText='Descarga aqui: '+dlUrl;
var dlCount=parseInt(localStorage.getItem('bpss_dl_count')||'0')+1;
localStorage.setItem('bpss_dl_count',dlCount);
document.getElementById('msg').innerHTML=
'<p style="color:#4caf50;font-size:.9rem">Listo</p>'+
'<a href="'+dlUrl+'" style="display:inline-block;margin-top:.6rem;padding:.6rem 1.5rem;background:#4caf50;color:#fff;text-decoration:none;border-radius:8px;font-weight:600">Descargar</a>'+
'<div style="display:flex;gap:.4rem;justify-content:center;margin-top:.5rem;flex-wrap:wrap">'+
'<button onclick="navigator.clipboard.writeText(\''+dlUrl+'\');this.textContent=\'Copiado!\'" style="padding:.4rem .8rem;background:#333;color:#fff;border:none;border-radius:8px;font-size:.7rem;cursor:pointer">Copiar enlace</button>'+
'<a href="https://wa.me/?text='+encodeURIComponent(shareText)+'" target="_blank" style="padding:.4rem .8rem;background:#25d366;color:#fff;text-decoration:none;border-radius:8px;font-size:.7rem">WhatsApp</a>'+
'<a href="https://t.me/share/url?url='+encodeURIComponent(dlUrl)+'&text='+encodeURIComponent('Descarga aqui')+'" target="_blank" style="padding:.4rem .8rem;background:#0088cc;color:#fff;text-decoration:none;border-radius:8px;font-size:.7rem">Telegram</a>'+
'</div>';
}else if(d.status==='error'){
document.getElementById('msg').innerHTML='<p style="color:#c0392b;font-size:.8rem;word-break:break-all;margin-top:.5rem">'+(d.error||'Error desconocido')+'</p><a href="/" style="display:inline-block;margin-top:.6rem;color:#fe2c55;font-size:.8rem">Volver</a>';
}else{
setTimeout(check,2000);
}
}).catch(function(){setTimeout(check,3000)});
}
setTimeout(check,2000);
</script>
</div>
</body>
</html>
