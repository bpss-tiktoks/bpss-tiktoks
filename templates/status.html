<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Descargando...</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/style.css">
</head>
<body><button class="theme-toggle" id="themeToggle" title="Tema">&#9789;</button>
<div class="container">
<h1>Bpss TikToks</h1>
<p class="warn">Videos/fotos privados no se pueden descargar. Solo publicos.</p>
<div id="msg">
<div class="spinner"></div>
<p class="loading-text" id="loadText">Descargando...</p>
</div>
<script>
var id='{{ task_id }}';
var tries=0;
var maxTries=300;
var msgs=['Descargando...','Procesando...','Casi listo...','Trabajando...'];
var mi=0;
function check(){
tries++;
if(tries>maxTries){
document.getElementById('msg').innerHTML='<p class="error-text">Timeout (10 min). Si es una playlist, intenta con menos videos.</p><a href="/" class="link-back">Volver</a>';
return;
}
if(tries%15===0&&tries<maxTries){mi=(mi+1)%msgs.length;var lt=document.getElementById('loadText');if(lt)lt.textContent=msgs[mi];}
fetch('/api/status/'+id).then(function(r){return r.json()}).then(function(d){
if(d.status==='done'){
var dlUrl=location.origin+'/download/'+d.file;
var shareText='Descarga aqui: '+dlUrl;
var dlCount=parseInt(localStorage.getItem('bpss_dl_count')||'0')+1;
localStorage.setItem('bpss_dl_count',dlCount);
var info='';
if(d.title)info+='<p class="file-title">'+d.title+'</p>';
if(d.size)info+='<p class="file-size">'+d.size+'</p>';
if(d.platform)info+='<p class="file-platform">''+d.platform+''</p>';if(d.thumbnail)info+='<img src="''+d.thumbnail+''" style="width:100%;max-height:200px;object-fit:cover;border-radius:8px;margin-top:.5rem">';
document.getElementById('msg').innerHTML=
'<p class="success-text">Listo</p>'+info+
'<a href="'+dlUrl+'" class="btn-download">Descargar</a>'+
'<div class="actions">'+
'<button class="btn-action" onclick="navigator.clipboard.writeText(\''+dlUrl+'\');this.textContent=\'Copiado\'">Copiar</button>'+
'<a class="btn-action" href="https://wa.me/?text='+encodeURIComponent(shareText)+'" target="_blank">WhatsApp</a>'+
'<a class="btn-action" href="https://t.me/share/url?url='+encodeURIComponent(dlUrl)+'" target="_blank">Telegram</a>'+
'</div>'+
'<form method="POST" action="/" class="next-form">'+
'<input type="text" name="url" placeholder="Otra URL...">'+
'<button type="submit" name="type" value="video">Video/Foto</button>'+
'<button type="submit" name="type" value="audio">Audio</button>'+
'</form>';
}else if(d.status==='error'){
document.getElementById('msg').innerHTML='<p class="error-text">'+(d.error||'Error')+'</p><a href="/" class="link-back">Volver</a>';
}else{
setTimeout(check,2000);
}
}).catch(function(){setTimeout(check,3000)});
}
setTimeout(check,2000);
</script>
</div>
<script>var isDark=localStorage.getItem("bpss_dark")==="1";function applyTheme(){document.body.classList.toggle("dark",isDark);document.getElementById("themeToggle").textContent=isDark?"\u2600\uFE0F":"\u263E\uFE0F";}applyTheme();document.getElementById("themeToggle").onclick=function(){isDark=!isDark;localStorage.setItem("bpss_dark",isDark?"1":"0");applyTheme();};</script></body>
</html>
