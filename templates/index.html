<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPSS TikTok Downloader</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<button class="theme-toggle" onclick="document.body.classList.toggle('dark')"></button>
<div class="container">
<h1>BPSS TikTok</h1>
<p class="sub">Descarga videos, fotos y lives sin marca de agua</p>
<input type="text" id="url" placeholder="Pega la URL de TikTok..." onkeydown="if(event.key==='Enter')dl()">
<div class="btns"><button onclick="dl()">Descargar</button></div>
<div class="error" id="error" style="display:none"></div>
<div class="result" id="result"></div>
</div>
<script>
async function dl(){
  const url=document.getElementById('url').value.trim();
  const err=document.getElementById('error');
  const res=document.getElementById('result');
  if(!url){err.textContent='Pega una URL válida';err.style.display='block';return;}
  err.style.display='none';
  res.innerHTML='<div class="spinner"></div><p class="loading-text">Descargando...</p>';
  try{
    const r=await fetch('/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'Error');
    const data=d.data;
    let h='';
    if(data.file)h+='<a class="btn-download" href="/files/'+data.file+'"> '+data.file+'</a>';
    if(data.images)data.images.forEach(f=>{h+='<div class="actions"><a class="btn-action" href="/files/'+f+'"> '+f+'</a></div>';});
    if(data.audio)h+='<div class="actions"><a class="btn-action" href="/files/'+data.audio+'"> '+data.audio+'</a></div>';
    res.innerHTML=h;
  }catch(e){err.textContent=e.message;err.style.display='block';res.innerHTML='';}
}
</script>
</body>
</html>
